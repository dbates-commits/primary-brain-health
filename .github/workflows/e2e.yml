name: E2E (smoke)

# Runs the env-free Playwright smoke tier on every PR: the marketing booking
# entry (package cards render, CTA opens the modal at signup). The full money
# path (onboarding.spec.ts, E2E_FULL_FLOW=1) is NOT run here — it needs a test
# DB, Stripe test keys, and a Linus stub, tracked separately.

on:
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

# One run per PR; cancel superseded runs.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Marketing reads its CMS content from disk instead of TinaCloud.
      TINA_PUBLIC_IS_LOCAL: "true"
      # Non-secret placeholders so the server boots; the smoke tier never
      # reaches payment/handoff, so these are never exercised.
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_placeholder"
      NEXT_PUBLIC_FUNNEL_URL: "http://localhost:3001"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run smoke E2E
        run: pnpm test:e2e --project=marketing

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
