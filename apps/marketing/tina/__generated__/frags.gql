fragment PageParts on Page {
  __typename
  title
  description
  socialImage
  blocks {
    __typename
    ... on PageBlocksHero {
      theme
      headline
      subheadlineRich
      image
      trustText
      primaryButtonText
      primaryButtonTextMobile
      primaryButtonLink
    }
    ... on PageBlocksFaq {
      variant
      theme
      headline
      subheadline
      items {
        __typename
        faq {
          ... on Faq {
            __typename
            question
            answer
            category
            sortOrder
          }
          ... on Document {
            _sys {
              filename
              basename
              hasReferences
              breadcrumbs
              path
              relativePath
              extension
            }
            id
          }
        }
      }
      limit
      showCategories
      ctaText
      ctaButtonText
      ctaLink
    }
    ... on PageBlocksIntakeForm {
      headline
      subheadline
      buttonText
      buttonTextMobile
      showIncludes
    }
    ... on PageBlocksScrollFillLogo {
      slides {
        __typename
        label
        headline
      }
    }
    ... on PageBlocksStackSections {
      label
      headline
      subheadline
      items {
        __typename
        title
        body
        icon
        image
      }
    }
    ... on PageBlocksBenefitsList {
      headline
      subheadline
      items {
        __typename
        title
        body
        icon
      }
    }
    ... on PageBlocksContactForm {
      headline
      subheadline
      buttonText
    }
  }
}

fragment ModalParts on Modal {
  __typename
