<!--
  `--font-inter` is set by next/font on <body> in the app's layout.tsx. Storybook
  never renders that layout, so the variable is defined here instead and the
  family itself is self-hosted via @fontsource/inter (see preview.ts). The token
  `--font-body` in @pbh/tokens reads `var(--font-inter, "Inter")`, so without
  this every story falls back to system-ui.
-->
<style>
  :root {
    --font-inter: "Inter";
  }
</style>

<!--
  Larken (`--font-headline`) comes from the Adobe Fonts kit that `layout.tsx`
  links. Storybook renders no layout, so the kit is linked here too — otherwise
  every headline falls back to Georgia. Keep the kit id in sync with
  `apps/marketing/src/app/layout.tsx`.
-->
<link rel="preconnect" href="https://use.typekit.net" crossorigin />
<link rel="stylesheet" href="https://use.typekit.net/qrz4jhn.css" />
